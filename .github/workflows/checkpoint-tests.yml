name: Execution checkpoint tests

on:
  pull_request:
    paths:
      - "skills/execution-checkpoint/**"
      - ".github/workflows/checkpoint-tests.yml"
      - "install.sh"
      - "tests/**"
      - "examples/opencode2/**"
      - "examples/opencode.jsonc"
      - "examples/pstack-models*.md"
      - "scripts/**"
      - "agents/**"
      - "adapters/**"
      - "antigravity/**"
      - "skills/*/SKILL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify checkpoint helper
        run: |
          sh -n install.sh
          python -m py_compile skills/execution-checkpoint/scripts/checkpoint.py
          python -m unittest discover -s skills/execution-checkpoint/tests -v
      - name: Generated agent files and Antigravity plugin
        run: |
          python scripts/build_agents.py --check
          python -m unittest tests/test_build_agents.py -v

  opencode2-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify V2 plugin lifecycle and isolation
        run: node --test examples/opencode2/pstack-execution-checkpoint.test.mjs
      - name: Antigravity hooks
        run: node --test 'antigravity/hooks/*.test.mjs'
      - name: Antigravity install
        run: sh tests/install-antigravity.sh "$PWD"

  install-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install.sh removes the Superpowers plugin and old skill copies
        run: sh tests/install-migration.sh "$PWD"
