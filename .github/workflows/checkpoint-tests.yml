name: Execution checkpoint tests

on:
  pull_request:
    paths:
      - "skills/execution-checkpoint/**"
      - ".github/workflows/checkpoint-tests.yml"
      - "examples/opencode2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify checkpoint helper
        run: |
          python -m py_compile skills/execution-checkpoint/scripts/checkpoint.py
          python -m unittest discover -s skills/execution-checkpoint/tests -v

  opencode2-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify V2 plugin lifecycle and isolation
        run: node --test examples/opencode2/pstack-execution-checkpoint.test.mjs
